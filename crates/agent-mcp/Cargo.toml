[package]
name = "agent-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-security = { path = "../agent-security" }
rig-core.workspace = true
rig-rmcp.workspace = true
agent-runtime = { path = "../agent-runtime" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
jsonschema = { version = "=0.60.2", default-features = false }
url = "=2.5.8"
http = "=1.5.0"
futures.workspace = true
# The rmcp public transport contract exposes sse-stream 0.2 types.
sse-stream = "=0.2.6"
base64 = "=0.23.1"

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = "=0.8.9"
tempfile.workspace = true

[features]
test-fixtures = ["rmcp/server", "rmcp/transport-io"]

[[bin]]
name = "agent-mcp-fixture"
path = "tests/support/stdio_fixture.rs"
required-features = ["test-fixtures"]
