language: "typescript"
layer: "application"
fileGroups:
  package:
    - "/apps/docs/**/*"
    - "!/apps/docs/dist/**/*"
    - "!/apps/docs/.astro/**/*"
    - "!/apps/docs/node_modules/**/*"
tasks:
  lint:
    args: ["--dir", "apps/docs", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args: ["--dir", "apps/docs", "--config.enable-pre-post-scripts=false", "run", "typecheck"]
  test:
    args: ["--dir", "apps/docs", "--config.enable-pre-post-scripts=false", "run", "test"]
    deps: ["docs:build"]
  build:
    args: ["--dir", "apps/docs", "--config.enable-pre-post-scripts=false", "run", "build"]
    deps: ["docs:typecheck"]
    outputs: ["/apps/docs/dist"]
  dev:
    command: ["pnpm", "--dir", "apps/docs", "--config.enable-pre-post-scripts=false", "run", "dev"]
    toolchains: "system"
    inputs: ["@group(package)"]
    preset: "server"
    options:
      runFromWorkspaceRoot: true
