[book]
title = "Lyonbrown Documentation"
description = "A local-first, model-provider-neutral general Agent Runtime"
authors = ["Lyonbrown Contributors"]
language = "en"
src = "src"

[build]
build-dir = "../../target/mdbook/en"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lyonbrown4d/lyonbrown"
git-repository-icon = "fab-github"

[output.html.search]
enable = true
