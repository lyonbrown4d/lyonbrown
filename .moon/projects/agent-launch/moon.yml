language: "typescript"
layer: "library"
dependsOn: ["agent-client", "local-control-plane"]
fileGroups:
  package: ["/packages/agent-launch/**/*"]
tasks:
  lint:
    args:
      ["--dir", "packages/agent-launch", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      [
        "--dir",
        "packages/agent-launch",
        "--config.enable-pre-post-scripts=false",
        "run",
        "typecheck",
      ]
  test:
    args:
      ["--dir", "packages/agent-launch", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args:
      ["--dir", "packages/agent-launch", "--config.enable-pre-post-scripts=false", "run", "build"]
    outputs: ["/packages/agent-launch/dist"]
