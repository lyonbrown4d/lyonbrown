[package]
name = "agent-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agent"
path = "src/main.rs"

[features]
default = []
llama-cpp = ["dep:provider-llamacpp", "provider-llamacpp/llama-cpp"]
cuda = ["llama-cpp", "provider-llamacpp/cuda"]
vulkan = ["llama-cpp", "provider-llamacpp/vulkan"]

[dependencies]
agent-core = { workspace = true }
agent-kernel = { workspace = true }
agent-index = { workspace = true }
agent-model = { workspace = true }
agent-context = { workspace = true }
agent-tool = { workspace = true }
agent-secret = { workspace = true }
agent-storage = { workspace = true }
agent-profile = { workspace = true }
agent-workspace = { workspace = true }
agent-skill = { workspace = true }
agent-mcp = { workspace = true }
provider-ollama = { workspace = true }
provider-anthropic = { workspace = true }
provider-openai = { workspace = true }
provider-mock = { workspace = true }
provider-llamacpp = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
provider-mock = { workspace = true }
chrono = { workspace = true }
wiremock = { workspace = true }
