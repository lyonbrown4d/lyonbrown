language: "typescript"
layer: "library"
fileGroups:
  package: ["/packages/decision-engine/**/*"]
tasks:
  lint:
    args:
      ["--dir", "packages/decision-engine", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      [
        "--dir",
        "packages/decision-engine",
        "--config.enable-pre-post-scripts=false",
        "run",
        "typecheck",
      ]
  test:
    args:
      ["--dir", "packages/decision-engine", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args:
      [
        "--dir",
        "packages/decision-engine",
        "--config.enable-pre-post-scripts=false",
        "run",
        "build",
      ]
    outputs: ["/packages/decision-engine/dist"]
