# Local-First 通用 Agent Runtime — workspace 根
# 骨架已就绪；实现按 docs/zh/src/plans/mvp-implementation-plan.md 的 M0..M9 进行。

[workspace]
resolver = "2"
members = [
    "crates/*",
    "providers/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# --- 内部 crate（严格 DAG：见 docs/zh/src/plans/mvp-implementation-plan.md §1）---
agent-core = { path = "crates/agent-core" }
agent-kernel = { path = "crates/agent-kernel" }
agent-model = { path = "crates/agent-model" }
agent-context = { path = "crates/agent-context" }
agent-profile = { path = "crates/agent-profile" }
agent-workspace = { path = "crates/agent-workspace" }
agent-skill = { path = "crates/agent-skill" }
agent-tool = { path = "crates/agent-tool" }
agent-secret = { path = "crates/agent-secret" }
agent-mcp = { path = "crates/agent-mcp" }
agent-storage = { path = "crates/agent-storage" }
provider-ollama = { path = "providers/provider-ollama" }
provider-anthropic = { path = "providers/provider-anthropic" }
provider-openai = { path = "providers/provider-openai" }
provider-mock = { path = "providers/provider-mock" }
provider-llamacpp = { path = "providers/provider-llamacpp" }

# --- 异步 ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# --- 序列化 / 配置 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
toml = "1.1.6"
config = { version = "0.15.26", default-features = false, features = ["toml", "yaml", "json", "json5", "ron", "ini"] }

# --- 错误 / 日志 ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- HTTP / CLI / 存储 ---
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# --- 基础 ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0.0"
which = "8.0.6"

# --- MCP（pin 精确版本；rmcp 3.4.0 已核实为最新稳定版）---
rmcp = { version = "3.4.0", features = ["client", "transport-child-process"] }

# --- 测试（仅 dev-dependency）---
wiremock = "0.6"
