syntax = "proto3";
package agent.v1;

service ModelService {
  // Empty session_id returns the authenticated global catalog with no selection.
  // A non-empty session_id must exist and includes that session's selection.
  rpc ListModels(SessionRequest) returns (Models);
  rpc SelectModel(SelectModelRequest) returns (ModelSelection);
  rpc HubOperation(HubRequest) returns (HubResponse);
}
message HubRequest { string action = 1; string repository = 2; string revision = 3; string file = 4; string runtime = 5; string id = 6; }
message HubResponse { string json = 1; }
message Models { repeated ModelCandidate models = 1; }
message ModelCandidate { string id = 1; string display_name = 2; string vendor = 3; string source = 4; string state = 5; bool selected = 6; repeated ModelExecution executions = 7; }
message ModelExecution { string id = 1; string label = 2; string transport = 3; string state = 4; string reason = 5; }
message SelectModelRequest { string session_id = 1; uint64 owner_epoch = 2; string model_id = 3; string execution_id = 4; }
message ModelSelection { string model_id = 1; string execution_id = 2; }

service ClientService {
  rpc GetNode(Empty) returns (Node);
  rpc PrepareUpgrade(Empty) returns (Node);
  rpc ResumeAccepting(Empty) returns (Node);
  rpc ListSessions(Empty) returns (Sessions);
  rpc GetRuntimeStatus(SessionRequest) returns (RuntimeStatus);
  rpc ListProviders(Empty) returns (Providers);
  rpc ListProviderProfiles(Empty) returns (ProviderProfiles);
  rpc PutProviderProfile(PutProviderProfileRequest) returns (ProviderProfile);
  rpc RemoveProviderProfile(RemoveProviderProfileRequest) returns (Empty);
  rpc ProbeProviderProfile(ProbeProviderProfileRequest) returns (ProviderProbe);
  rpc PutProviderCredential(PutProviderCredentialRequest) returns (Provider);
  rpc RemoveProviderCredential(RemoveProviderCredentialRequest) returns (Provider);
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc GetSession(SessionRequest) returns (Session);
  rpc StartRun(StartRunRequest) returns (Run);
  rpc StartRunWithAttachments(StartRunWithAttachmentsRequest) returns (Run);
  rpc GetContextStatus(SessionRequest) returns (ContextStatus);
  rpc GetContextSummary(SessionRequest) returns (ContextSummary);
  rpc CompactContext(CompactContextRequest) returns (ContextStatus);
  rpc UndoContextCompaction(UndoContextCompactionRequest) returns (ContextStatus);
  rpc CancelContext(CancelContextRequest) returns (ContextMaintenanceJob);
  rpc GetContextMaintenance(SessionRequest) returns (ContextMaintenanceJob);
  rpc AbandonContext(AbandonContextRequest) returns (AbandonContextResult);
  rpc GetInteractionPolicy(SessionRequest) returns (InteractionPolicy);
  rpc SetInteractionMode(SetInteractionModeRequest) returns (InteractionPolicy);
  rpc SubmitRunInput(RunInputRequest) returns (RunInputReceipt);
  rpc CancelRunInput(CancelRunInputRequest) returns (RunInputReceipt);
  rpc ListRunInputs(RunRequest) returns (RunInputs);
  rpc ListRuns(SessionRequest) returns (Runs);
  rpc GetRun(RunRequest) returns (Run);
  rpc WatchRun(WatchRequest) returns (stream Event);
  rpc CancelRun(RunRequest) returns (Run);
  rpc GetRunRecovery(RunRequest) returns (RunRecovery);
  rpc RecoverRun(RecoverRunRequest) returns (RunRecoveryResult);
  rpc ListApprovals(RunRequest) returns (Approvals);
  rpc ApproveAction(ApproveRequest) returns (Approval);
}
service MemoryService {
  rpc ListMemories(ListMemoriesRequest) returns (Memories);
  rpc GetMemory(GetMemoryRequest) returns (MemoryRecord);
  rpc PutMemory(PutMemoryRequest) returns (MemoryRecord);
  rpc ForgetMemory(ForgetMemoryRequest) returns (MemoryRecord);
  rpc SearchMemories(SearchMemoriesRequest) returns (MemoryMatches);
  rpc ListMemoryJobs(GetMemoryRequest) returns (MemoryJobs);
  rpc RetryMemoryJob(RetryMemoryJobRequest) returns (Empty);
  rpc GetMemoryStatus(Empty) returns (MemoryStatus);
  rpc StartMemoryRebuild(StartMemoryRebuildRequest) returns (MemoryRebuild);
  rpc ListMemoryRebuilds(ListMemoryRebuildsRequest) returns (MemoryRebuilds);
}
enum MemoryScopeKind { MEMORY_SCOPE_KIND_UNSPECIFIED = 0; MEMORY_SCOPE_KIND_USER = 1; MEMORY_SCOPE_KIND_PROJECT = 2; MEMORY_SCOPE_KIND_SESSION = 3; }
enum MemoryKind { MEMORY_KIND_UNSPECIFIED = 0; MEMORY_KIND_PREFERENCE = 1; MEMORY_KIND_FACT = 2; MEMORY_KIND_PROCEDURE = 3; }
enum MemoryState { MEMORY_STATE_UNSPECIFIED = 0; MEMORY_STATE_PROPOSED = 1; MEMORY_STATE_ACTIVE = 2; MEMORY_STATE_SUPERSEDED = 3; MEMORY_STATE_REJECTED = 4; MEMORY_STATE_DELETED = 5; }
enum MemoryJobKind { MEMORY_JOB_KIND_UNSPECIFIED = 0; MEMORY_JOB_KIND_UPSERT = 1; MEMORY_JOB_KIND_DELETE = 2; }
enum MemoryJobState { MEMORY_JOB_STATE_UNSPECIFIED = 0; MEMORY_JOB_STATE_PENDING = 1; MEMORY_JOB_STATE_RUNNING = 2; MEMORY_JOB_STATE_COMPLETED = 3; MEMORY_JOB_STATE_FAILED = 4; MEMORY_JOB_STATE_UNCERTAIN = 5; }
message MemoryScope { MemoryScopeKind kind = 1; string id = 2; }
message MemoryRecord { string id = 1; MemoryScope scope = 2; MemoryKind kind = 3; MemoryState state = 4; string content = 5; uint64 revision = 6; int64 created_at_ms = 7; int64 updated_at_ms = 8; optional int64 expires_at_ms = 9; }
message ListMemoriesRequest { string session_id = 1; repeated MemoryState states = 2; string after_id = 3; uint32 limit = 4; }
message Memories { repeated MemoryRecord items = 1; string next_cursor = 2; }
message GetMemoryRequest { string session_id = 1; string memory_id = 2; }
// Scope identifiers are resolved by daemon from the authenticated owner and Session.
message PutMemoryRequest { string session_id = 1; string id = 2; string request_id = 3; MemoryScopeKind scope_kind = 4; MemoryKind kind = 5; MemoryState state = 6; string content = 7; uint64 expected_revision = 8; optional int64 expires_at_ms = 9; }
message ForgetMemoryRequest { string session_id = 1; string memory_id = 2; uint64 expected_revision = 3; }
message SearchMemoriesRequest { string session_id = 1; string query = 2; uint32 limit = 3; }
message MemoryMatch { MemoryRecord memory = 1; float score = 2; }
message MemoryMatches { repeated MemoryMatch items = 1; }
message MemoryJob { string id = 1; string memory_id = 2; uint64 revision = 3; MemoryJobKind kind = 4; MemoryJobState state = 5; uint32 attempts = 6; optional string error_category = 7; }
message MemoryJobs { repeated MemoryJob jobs = 1; }
message RetryMemoryJobRequest { string session_id = 1; string memory_id = 2; string job_id = 3; }
message MemoryStatus { bool retrieval_ready = 1; string vector_backend = 2; string detail = 3; string embedding_model = 4; uint32 dimensions = 5; }

service WorkspaceService {
  rpc ListFiles(ListFilesRequest) returns (WorkspaceFiles);
  rpc ReadFile(ReadFileRequest) returns (WorkspaceFile);
  rpc WriteFile(WriteFileRequest) returns (WorkspaceFile);
  rpc GetGitStatus(SessionRequest) returns (GitStatus);
  rpc GetDiff(DiffRequest) returns (WorkspaceDiff);
  rpc WatchFiles(SessionRequest) returns (stream WorkspaceChange);
}
service SkillService {
  rpc ListSkills(ListSkillsRequest) returns (Skills);
  rpc InspectSkill(InspectSkillRequest) returns (SkillInspection);
  rpc InstallSkill(InstallSkillRequest) returns (Skill);
  rpc RemoveSkill(RemoveSkillRequest) returns (Skill);
}
service TaskService {
  rpc SubmitTask(TaskEnvelope) returns (Task);
  rpc GetTask(TaskRequest) returns (Task);
  rpc WatchTask(WatchRequest) returns (stream Event);
  rpc CancelTask(TaskRequest) returns (Task);
  rpc AcceptResult(AcceptResultRequest) returns (Task);
}
// Local authenticated Master management. Peer TaskService is a separate mTLS
// boundary; clients never acquire peer credentials or execute Worker tasks.
service OrchestrationService {
  rpc DispatchTask(DispatchTaskRequest) returns (Task);
  rpc GetTask(TaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (Tasks);
  rpc ReconcileTask(RemoteTaskRequest) returns (Task);
  rpc CancelTask(RemoteTaskRequest) returns (Task);
  rpc AcceptResult(AcceptRemoteResultRequest) returns (Task);
}
service PeerService {
  rpc Hello(Node) returns (Node);
  rpc ListPeers(Empty) returns (Nodes);
  rpc Pair(PairRequest) returns (PeerTrust);
  rpc Revoke(PeerRequest) returns (PeerTrust);
}
service BrowserService {
  rpc GetFrame(FrameRequest) returns (BrowserFrame);
  rpc SendInput(BrowserInput) returns (Empty);
  rpc OpenSpace(OpenSpaceRequest) returns (BrowserSpace);
  rpc ListSpaces(Empty) returns (BrowserSpaces);
  rpc OpenTab(OpenTabRequest) returns (BrowserTab);
  rpc Observe(ObserveRequest) returns (BrowserObservation);
  rpc Act(BrowserAction) returns (BrowserActionResult);
  rpc Takeover(TakeoverRequest) returns (BrowserSpace);
  rpc CloseSpace(SpaceRequest) returns (Empty);
}
// Authenticated local client owns the native execution surface. agentd owns
// routing and session authorization; command payloads contain no CEF pointers.
service BrowserRuntimeService {
  rpc Attach(stream BrowserRuntimeResponse) returns (stream BrowserRuntimeRequest);
}
// Interactive-user native execution uses an authenticated reverse channel.
// Payloads are versioned runtime messages, never OS handles or model commands.
// Attaching a helper does not authorize an action: agentd owns exact approvals.
service ComputerRuntimeService {
  rpc Attach(stream ComputerRuntimeResponse) returns (stream ComputerRuntimeRequest);
}
service ControlService {
  rpc Register(RegisterRequest) returns (Node);
  rpc Resolve(PeerRequest) returns (Node);
  rpc Pair(PairRequest) returns (PeerTrust);
  rpc Relay(stream RelayEnvelope) returns (stream RelayEnvelope);
}
message Empty {}
message Node { string id = 1; string name = 2; string os = 3; string endpoint = 4; string fingerprint = 5; repeated string capabilities = 6; uint32 protocol_version = 7; string daemon_version = 8; uint32 protocol_min = 9; uint32 protocol_max = 10; uint32 active_runs = 11; uint32 storage_schema_version = 12; bool draining = 13; }
message Nodes { repeated Node nodes = 1; }
message Session { string id = 1; string title = 2; string workspace = 3; string owner_node_id = 4; uint64 owner_epoch = 5; int64 created_at_ms = 6; }
message Sessions { repeated Session sessions = 1; }
message RuntimeStatus { Node node = 1; Session session = 2; Run active_run = 3; string provider = 4; string model = 5; uint32 pending_approvals = 6; uint32 tools = 7; uint32 mcp_servers = 8; }
enum RemoteProviderProtocol { REMOTE_PROVIDER_PROTOCOL_UNSPECIFIED = 0; REMOTE_PROVIDER_PROTOCOL_OPENAI_RESPONSES = 1; REMOTE_PROVIDER_PROTOCOL_OPENAI_COMPLETIONS = 2; REMOTE_PROVIDER_PROTOCOL_ANTHROPIC_MESSAGES = 3; REMOTE_PROVIDER_PROTOCOL_GEMINI_GENERATE_CONTENT = 4; }
message ProviderProfile { string id = 1; string name = 2; RemoteProviderProtocol protocol = 3; string base_url = 4; string model = 5; uint64 revision = 6; bool credential_configured = 7; }
message ProviderProfiles { repeated ProviderProfile profiles = 1; }
// revision=0 creates a new UUID identity; otherwise compare-and-swap the existing revision.
// Empty credential preserves the existing secret reference; it is invalid on creation.
message PutProviderProfileRequest { ProviderProfile profile = 1; bytes credential = 2; }
message RemoveProviderProfileRequest { string id = 1; uint64 expected_revision = 2; }
// Read-only GET to the protocol's models endpoint; never starts inference or saves a draft.
message ProbeProviderProfileRequest { ProviderProfile profile = 1; bytes credential = 2; }
message ProviderProbe { bool reachable = 1; string message = 2; repeated string model_ids = 3; }
message ProviderModel { string id = 1; bool selected = 2; }
message Provider { string id = 1; string name = 2; repeated string protocols = 3; bool runtime_supported = 4; bool selected = 5; string credential_state = 6; string credential_source = 7; string credential_environment = 8; repeated ProviderModel models = 9; }
message Providers { repeated Provider providers = 1; }
message PutProviderCredentialRequest { string provider_id = 1; bytes credential = 2; }
message RemoveProviderCredentialRequest { string provider_id = 1; }
message CreateSessionRequest { string title = 1; string workspace = 2; }
message SessionRequest { string session_id = 1; }
message StartRunRequest { string session_id = 1; string prompt = 2; string idempotency_key = 3; uint64 owner_epoch = 4; }
message Run { string id = 1; string session_id = 2; string status = 3; string prompt = 4; string result = 5; string error = 6; int64 created_at_ms = 7; }
message Runs { repeated Run runs = 1; }
message RunRequest { string run_id = 1; }
// Recovery never replays the original prompt or acknowledges an unknown effect as success.
enum RunRecoveryAction {
  RUN_RECOVERY_ACTION_UNSPECIFIED = 0;
  RUN_RECOVERY_ACTION_ABANDON = 1;
  RUN_RECOVERY_ACTION_CONTINUE_NEW_SESSION = 2;
}
message RunRecovery {
  Run run = 1;
  uint64 owner_epoch = 2;
  string reason = 3;
  repeated string pending_tools = 4;
  repeated RunRecoveryAction allowed_actions = 5;
  RunRecoveryResult resolution = 6;
  bool fresh_session_required = 7;
}
message RecoverRunRequest {
  string run_id = 1;
  uint64 owner_epoch = 2;
  RunRecoveryAction action = 3;
  string idempotency_key = 4;
  // Human verification record; cannot grant tool/model/node authority.
  string note = 5;
  // Explicit fresh input, required only for CONTINUE_NEW_SESSION.
  string prompt = 6;
}
message RunRecoveryResult {
  Run original_run = 1;
  Session session = 2;
  Run run = 3;
  RunRecoveryAction action = 4;
  string note = 5;
  // Epoch and identity of the original recovery request, preserved for exact retries.
  uint64 owner_epoch = 6;
  string idempotency_key = 7;
}
message WatchRequest { string run_id = 1; uint64 after_cursor = 2; }
message Event { uint64 cursor = 1; string run_id = 2; string kind = 3; string payload_json = 4; int64 created_at_ms = 5; }
message Approval { string id = 1; string run_id = 2; string tool = 3; string arguments_json = 4; string status = 5; int64 expires_at_ms = 6; }
message Approvals { repeated Approval approvals = 1; }
message ApproveRequest { string approval_id = 1; bool approved = 2; }
message TaskEnvelope { string task_id = 1; string parent_run_id = 2; string session_id = 3; string owner_node_id = 4; uint64 owner_epoch = 5; string attempt_id = 6; string instructions = 7; repeated string capabilities = 8; string workspace = 9; string idempotency_key = 10; int64 deadline_ms = 11; }
message Task { TaskEnvelope envelope = 1; string status = 2; string attempt_status = 3; string result = 4; string error = 5; uint64 cursor = 6; }
message TaskRequest { string task_id = 1; }
message Tasks { repeated Task tasks = 1; string next_task_id = 2; }
message ListTasksRequest { string session_id = 1; string after_task_id = 2; uint32 page_size = 3; }
message DispatchTaskRequest { Node target = 1; TaskEnvelope envelope = 2; }
message RemoteTaskRequest { Node target = 1; string task_id = 2; }
message AcceptRemoteResultRequest { Node target = 1; string task_id = 2; bool accepted = 3; }
message AcceptResultRequest { string task_id = 1; string attempt_id = 2; uint64 owner_epoch = 3; bool accepted = 4; }
message PeerRequest { string node_id = 1; }
message PairRequest { string node_id = 1; string fingerprint = 2; string pairing_code = 3; repeated string capabilities = 4; string certificate_pem = 5; string noise_public_key = 6; }
message PeerTrust { string node_id = 1; string fingerprint = 2; repeated string capabilities = 3; bool revoked = 4; string certificate_pem = 5; string noise_public_key = 6; }
message RegisterRequest { Node node = 1; string public_key = 2; }
message RelayEnvelope { string link_id = 1; string source_node_id = 2; string target_node_id = 3; uint64 seq = 4; bytes ciphertext = 5; }
message OpenSpaceRequest { string session_id = 1; string profile_id = 2; bool headless = 3; string host_id = 4; }
message BrowserSpace { string id = 1; string profile_id = 2; string session_id = 3; string host_id = 4; bool human_control = 5; }
message BrowserSpaces { repeated BrowserSpace spaces = 1; }
message OpenTabRequest { string space_id = 1; string url = 2; }
message BrowserTab { string id = 1; string space_id = 2; string url = 3; string title = 4; }
message SpaceRequest { string space_id = 1; }
message ObserveRequest { string tab_id = 1; bool screenshot = 2; }
message BrowserObservation { string snapshot_id = 1; string tab_id = 2; uint64 revision = 3; string accessibility_json = 4; string screenshot_artifact = 5; }
message BrowserAction { string action_id = 1; string tab_id = 2; string snapshot_id = 3; uint64 revision = 4; string kind = 5; string element_ref = 6; string text = 7; uint32 timeout_ms = 8; }
message BrowserActionResult { string action_id = 1; string status = 2; string error = 3; BrowserObservation observation = 4; }
message TakeoverRequest { string space_id = 1; bool human_control = 2; }

message ListFilesRequest { string session_id = 1; string directory = 2; }
message WorkspaceEntry { string path = 1; bool directory = 2; uint64 size = 3; }
message WorkspaceFiles { repeated WorkspaceEntry entries = 1; }
message ReadFileRequest { string session_id = 1; string path = 2; }
message WorkspaceFile { string path = 1; string content = 2; string revision = 3; }
message WriteFileRequest { string session_id = 1; string path = 2; string content = 3; string expected_revision = 4; }
message DiffRequest { string session_id = 1; string path = 2; }
message WorkspaceDiff { string patch = 1; }
message GitEntry { string path = 1; string index_status = 2; string worktree_status = 3; string original_path = 4; }
message GitStatus { bool repository = 1; string branch = 2; string head = 3; string upstream = 4; int32 ahead = 5; int32 behind = 6; repeated GitEntry entries = 7; }
message Skill { string name = 1; string description = 2; string compatibility = 3; string content_sha256 = 4; uint64 total_bytes = 5; uint32 files = 6; string scope = 7; bool enabled = 8; }
message Skills { repeated Skill skills = 1; }
message ListSkillsRequest { string scope = 1; string session_id = 2; }
message InspectSkillRequest { string source = 1; string scope = 2; string session_id = 3; }
message SkillFile { string path = 1; uint64 bytes = 2; string sha256 = 3; }
message SkillInspection { Skill skill = 1; repeated SkillFile files = 2; }
message InstallSkillRequest { string source = 1; string scope = 2; string session_id = 3; string expected_sha256 = 4; }
message RemoveSkillRequest { string name = 1; string scope = 2; string session_id = 3; string expected_sha256 = 4; }
message WorkspaceChange { string kind = 1; repeated string paths = 2; }
message FrameRequest { string tab_id = 1; uint64 after_sequence = 2; }
message BrowserFrame { string tab_id = 1; uint64 revision = 2; uint64 sequence = 3; uint32 width = 4; uint32 height = 5; uint32 stride = 6; bytes bgra8 = 7; }
message BrowserInput { string tab_id = 1; uint64 revision = 2; string kind = 3; int32 x = 4; int32 y = 5; int32 button = 6; int32 key_code = 7; string text = 8; uint32 width = 9; uint32 height = 10; int32 delta_x = 11; int32 delta_y = 12; uint32 modifiers = 13; }
message BrowserRuntimeRequest { string request_id = 1; bytes payload = 2; }
message BrowserRuntimeResponse { string request_id = 1; string host_id = 2; uint32 protocol_version = 3; bytes payload = 4; }
message ComputerRuntimeRequest { string request_id = 1; bytes payload = 2; }
message ComputerRuntimeResponse { string request_id = 1; string host_id = 2; uint32 protocol_version = 3; bytes payload = 4; string daemon_session_id = 5; }

// Inputs are durable Harness queue commands, never implicit StartRun retries.
enum RunInputKind { RUN_INPUT_KIND_UNSPECIFIED = 0; RUN_INPUT_KIND_STEER = 1; RUN_INPUT_KIND_FOLLOW_UP = 2; }
enum RunInputState { RUN_INPUT_STATE_UNSPECIFIED = 0; RUN_INPUT_STATE_PENDING = 1; RUN_INPUT_STATE_CONSUMED = 2; RUN_INPUT_STATE_CANCELLED = 3; RUN_INPUT_STATE_CANCEL_REQUESTED = 4; }
message RunInputRequest { string run_id = 1; uint64 owner_epoch = 2; string request_id = 3; RunInputKind kind = 4; string prompt = 5; }
message CancelRunInputRequest { string run_id = 1; uint64 owner_epoch = 2; string entry_id = 3; }
message RunInputReceipt { string run_id = 1; string request_id = 2; string entry_id = 3; RunInputKind kind = 4; RunInputState state = 5; string prompt = 6; bool prompt_truncated = 7; }
message RunInputs { repeated RunInputReceipt inputs = 1; bool history_truncated = 2; }

message RunImageAttachment { string mime_type = 1; bytes data = 2; string sha256 = 3; }
message StartRunWithAttachmentsRequest { string session_id = 1; uint64 owner_epoch = 2; string prompt = 3; string idempotency_key = 4; repeated RunImageAttachment images = 5; }
enum InteractionMode { INTERACTION_MODE_UNSPECIFIED = 0; INTERACTION_MODE_READ_ONLY = 1; INTERACTION_MODE_PLAN = 2; INTERACTION_MODE_EXECUTE = 3; }
message InteractionPolicy { uint64 revision = 1; InteractionMode mode = 2; repeated ToolAvailability tools = 3; string run_id = 4; }
message ToolAvailability { string name = 1; bool available = 2; bool requires_approval = 3; ToolAvailabilityState state = 4; }
message SetInteractionModeRequest { string session_id = 1; uint64 owner_epoch = 2; uint64 expected_revision = 3; InteractionMode mode = 4; }

message StartMemoryRebuildRequest { string session_id = 1; string request_id = 2; bool force = 3; }
message ListMemoryRebuildsRequest { string session_id = 1; string after_id = 2; uint32 limit = 3; }
enum MemoryRebuildState { MEMORY_REBUILD_STATE_UNSPECIFIED = 0; MEMORY_REBUILD_STATE_PENDING = 1; MEMORY_REBUILD_STATE_COMPLETED = 2; }
message MemoryRebuild { string id = 1; repeated MemoryScope scopes = 2; string embedding_id = 3; string embedding_model = 4; uint32 dimensions = 5; string configuration_revision = 6; MemoryRebuildState state = 7; string after_id = 8; uint64 scanned = 9; uint64 enqueued = 10; int64 created_at_ms = 11; int64 updated_at_ms = 12; }
message MemoryRebuilds { repeated MemoryRebuild items = 1; string next_cursor = 2; }

message ContextStatus { uint64 revision = 1; uint64 message_count = 2; uint64 compaction_count = 3; bool has_summary = 4; bool can_undo = 5; uint64 estimated_input_tokens = 6; uint32 context_window = 7; uint32 reserved_output_tokens = 8; bool summary_request_pending = 9; bool summary_pipeline_available = 10; bool estimate_includes_tools = 11; bool manual_operations_available = 12; ContextMaintenanceJob maintenance = 13; }
message ContextSummary { uint64 revision = 1; string text = 2; bool truncated = 3; }
message CompactContextRequest { string session_id = 1; uint64 owner_epoch = 2; uint64 expected_revision = 3; string focus = 4; }
message UndoContextCompactionRequest { string session_id = 1; uint64 owner_epoch = 2; uint64 expected_revision = 3; }

// Durable progress and reviewable filesystem changes are daemon-owned resources.
service WorkflowService {
  rpc ListPlans(ListWorkflowPlansRequest) returns (WorkflowPlans);
  rpc GetPlan(GetWorkflowPlanRequest) returns (WorkflowPlan);
  rpc MutatePlan(MutateWorkflowPlanRequest) returns (WorkflowPlan);
  rpc ListChanges(ListWorkflowChangesRequest) returns (WorkflowChanges);
  rpc GetChange(GetWorkflowChangeRequest) returns (WorkflowChange);
  rpc PreviewUndo(PreviewWorkflowUndoRequest) returns (WorkflowChange);
  rpc ApplyChange(ApplyWorkflowChangeRequest) returns (WorkflowChange);
}
enum WorkflowStepState {
  WORKFLOW_STEP_STATE_UNSPECIFIED = 0;
  WORKFLOW_STEP_STATE_PENDING = 1;
  WORKFLOW_STEP_STATE_RUNNING = 2;
  WORKFLOW_STEP_STATE_BLOCKED = 3;
  WORKFLOW_STEP_STATE_COMPLETED = 4;
  WORKFLOW_STEP_STATE_SKIPPED = 5;
}
message WorkflowStepDraft { string id = 1; string title = 2; repeated string dependencies = 3; repeated string acceptance = 4; }
message WorkflowPlanDraft { string title = 1; repeated WorkflowStepDraft steps = 2; }
message WorkflowStep { WorkflowStepDraft definition = 1; WorkflowStepState state = 2; string reported_result = 3; repeated string verification_refs = 4; optional string user_override = 5; }
message WorkflowVerification { string id = 1; string step_id = 2; string evidence_ref = 3; repeated string acceptance = 4; bool passed = 5; string summary = 6; }
message WorkflowPlan { string id = 1; string session_id = 2; string run_id = 3; uint64 owner_epoch = 4; uint64 revision = 5; string title = 6; repeated WorkflowStep steps = 7; repeated WorkflowVerification verifications = 8; bool detail_included = 9; }
message ListWorkflowPlansRequest { string session_id = 1; string run_id = 2; string after_id = 3; uint32 limit = 4; }
message WorkflowPlans { repeated WorkflowPlan plans = 1; string next_after = 2; }
message GetWorkflowPlanRequest { string session_id = 1; string plan_id = 2; }
message UpdateWorkflowStep { string step_id = 1; WorkflowStepState state = 2; string reported_result = 3; repeated string verification_refs = 4; optional string user_override = 5; }
// The host derives success from a durable execute_command operation. No caller-supplied passed flag exists.
message VerifyWorkflowStep { string step_id = 1; string operation_id = 2; }
message MutateWorkflowPlanRequest {
  string session_id = 1; string run_id = 2; string request_id = 3; string plan_id = 4; uint64 expected_revision = 5;
  oneof change { WorkflowPlanDraft create = 6; WorkflowPlanDraft revise = 7; UpdateWorkflowStep update_step = 8; VerifyWorkflowStep verify_step = 9; }
}
enum WorkflowChangeState { WORKFLOW_CHANGE_STATE_UNSPECIFIED = 0; WORKFLOW_CHANGE_STATE_PREVIEW = 1; WORKFLOW_CHANGE_STATE_PREPARED = 2; WORKFLOW_CHANGE_STATE_APPLIED = 3; WORKFLOW_CHANGE_STATE_UNCERTAIN = 4; }
message WorkflowChangeFile { string path = 1; string expected_revision = 2; optional string before = 3; optional string after = 4; optional string before_sha256 = 5; optional string after_sha256 = 6; string unified_diff = 7; }
message WorkflowChangeValidation { string id = 1; string change_id = 2; uint64 change_revision = 3; string change_sha256 = 4; string operation_id = 5; bool passed = 6; optional int64 exit_code = 7; bool verifies_current_workspace = 8; }
message WorkflowChange { string id = 1; string run_id = 2; uint64 owner_epoch = 3; uint64 revision = 4; WorkflowChangeState state = 5; string preview_sha256 = 6; repeated WorkflowChangeFile files = 7; optional string reverses = 8; optional string action_id = 9; repeated string written_paths = 10; repeated WorkflowChangeValidation validations = 11; bool detail_included = 12; }
message ListWorkflowChangesRequest { string session_id = 1; string after_id = 2; uint32 limit = 3; }
message WorkflowChanges { repeated WorkflowChange changes = 1; string next_after = 2; }
message GetWorkflowChangeRequest { string session_id = 1; string change_id = 2; }
message PreviewWorkflowUndoRequest { string session_id = 1; string run_id = 2; string request_id = 3; string change_id = 4; uint64 owner_epoch = 5; }
message ApplyWorkflowChangeRequest { string session_id = 1; string run_id = 2; string request_id = 3; string change_id = 4; uint64 expected_revision = 5; string preview_sha256 = 6; string action_id = 7; uint64 owner_epoch = 8; }

enum ToolAvailabilityState { TOOL_AVAILABILITY_STATE_UNSPECIFIED = 0; TOOL_AVAILABILITY_STATE_CONFIGURED = 1; TOOL_AVAILABILITY_STATE_AVAILABLE = 2; TOOL_AVAILABILITY_STATE_MODE_RESTRICTED = 3; TOOL_AVAILABILITY_STATE_EXECUTION_PLAN_RESTRICTED = 4; TOOL_AVAILABILITY_STATE_RUNTIME_UNAVAILABLE = 5; }

// These states describe host-owned summary maintenance, never AgentRun execution.
enum ContextMaintenanceState { CONTEXT_MAINTENANCE_STATE_UNSPECIFIED = 0; CONTEXT_MAINTENANCE_STATE_PREPARING = 1; CONTEXT_MAINTENANCE_STATE_SENDING = 2; CONTEXT_MAINTENANCE_STATE_COMPLETED = 3; CONTEXT_MAINTENANCE_STATE_FAILED = 4; CONTEXT_MAINTENANCE_STATE_CANCELLED = 5; CONTEXT_MAINTENANCE_STATE_UNCERTAIN = 6; CONTEXT_MAINTENANCE_STATE_ABANDONED = 7; }
message ContextMaintenanceJob { string id = 1; string session_id = 2; string run_id = 3; uint64 owner_epoch = 4; uint64 expected_revision = 5; ContextMaintenanceState state = 6; bool cancel_requested = 7; bool undo = 8; int64 created_at_ms = 9; int64 updated_at_ms = 10; optional string abandon_reason = 11; }
message CancelContextRequest { string job_id = 1; uint64 owner_epoch = 2; }

message AbandonContextRequest { string job_id = 1; uint64 owner_epoch = 2; string request_id = 3; string reason = 4; }
message AbandonContextResult { ContextMaintenanceJob job = 1; Session session = 2; bool new_session_required = 3; }
