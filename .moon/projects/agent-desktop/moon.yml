language: "typescript"
layer: "tool"
dependsOn: ["agent-client", "agent-launch", "agentd", "control-plane-native"]
fileGroups:
  package: ["/apps/agent-desktop/**/*"]
tasks:
  lint:
    args: ["--dir", "apps/agent-desktop", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      ["--dir", "apps/agent-desktop", "--config.enable-pre-post-scripts=false", "run", "typecheck"]
  test:
    args: ["--dir", "apps/agent-desktop", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args: ["--dir", "apps/agent-desktop", "--config.enable-pre-post-scripts=false", "run", "build"]
    outputs: ["/apps/agent-desktop/dist"]
  dev:
    args: ["--dir", "apps/agent-desktop", "run", "dev"]
    deps: ["agent-desktop:build"]
    preset: "server"
    options:
      interactive: true
