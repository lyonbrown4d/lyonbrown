[package]
name = "agent-launch"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agent-package"
path = "../../packaging/src/main.rs"

[[bin]]
name = "agent-install"
path = "../../packaging/src/install.rs"

[dependencies]
agent-client = { path = "../agent-client" }
anyhow.workspace = true
directories.workspace = true
fs2.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
service-manager = "0.11"
plist = "1.10"
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
cef-bundle = ["dep:cef"]

[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "154.5.0", default-features = false, features = ["build-util"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cef = { version = "154.5.0", default-features = false, features = ["build-util"], optional = true }

[target.'cfg(windows)'.dependencies]
cef = { version = "154.5.0", default-features = false, features = ["build-util", "sandbox"], optional = true }
windows-service = "=0.8.1"
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Authentication_Identity", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Services", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
