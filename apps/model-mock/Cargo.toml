[package]
name = "model-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-test-support = { path = "../../crates/agent-test-support" }
agent-telemetry = { path = "../../crates/agent-telemetry" }
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap.workspace = true
config = { version = "0.15", default-features = false, features = ["toml", "json"] }
directories.workspace = true
dotenvy.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
futures.workspace = true
wiremock = "=0.6.5"

[dev-dependencies]
ollama-rs = { version = "=0.3.6", default-features = false, features = ["stream"] }
agent-inference = { path = "../../crates/agent-inference" }
decision-core = { path = "../../crates/decision-core" }
decision-model = { path = "../../crates/decision-model" }
model-provider = { path = "../../crates/model-provider" }
rpi-ai = { version = "=0.14.0", features = ["providers"] }
tempfile.workspace = true
