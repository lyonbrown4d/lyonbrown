[package]
name = "agentd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
local-llama = ["agent-inference/llama"]
local-mistral = ["agent-inference/mistral"]

[dependencies]
gateway-core = { path = "../../crates/gateway-core" }
gateway-storage = { path = "../../crates/gateway-storage" }
model-provider = { path = "../../crates/model-provider" }
agent-privacy = { path = "../../crates/agent-privacy" }
axum = "=0.8.9"
base64 = "=0.23.1"
agent-media = { path = "../../crates/agent-media" }
agent-planning = { path = "../../crates/agent-planning" }
agent-changes = { path = "../../crates/agent-changes" }
agent-memory = { path = "../../crates/agent-memory" }
memory-core = { path = "../../crates/memory-core" }
memory-qdrant = { path = "../../crates/memory-qdrant" }
decision-core = { path = "../../crates/decision-core" }
sha2.workspace = true
subtle = "=2.6.1"
hex.workspace = true
url = "=2.5.8"
agent-mcp = { path = "../../crates/agent-mcp" }
agent-inference = { path = "../../crates/agent-inference" }
fluxdi.workspace = true
agent-config = { path = "../../crates/agent-config" }
agent-decision = { path = "../../crates/agent-decision" }
agent-distributed = { path = "../../crates/agent-distributed" }
agent-browser = { path = "../../crates/agent-browser" }
agent-computer = { path = "../../crates/agent-computer", default-features = false }
agent-computer-runtime = { path = "../../crates/agent-computer-runtime", default-features = false }
uuid.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
agent-telemetry = { path = "../../crates/agent-telemetry" }
agent-core = { path = "../../crates/agent-core" }
agent-protocol = { path = "../../crates/agent-protocol" }
agent-runtime = { path = "../../crates/agent-runtime" }
agent-security = { path = "../../crates/agent-security" }
agent-secrets = { path = "../../crates/agent-secrets" }
agent-model-hub = { path = "../../crates/agent-model-hub" }
agent-skills = { package = "lyonbrown-skills", path = "../../crates/agent-skills" }
agent-storage = { path = "../../crates/agent-storage" }
agent-workspace = { path = "../../crates/agent-workspace" }
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
directories.workspace = true
dotenvy.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-stream = "=0.3.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }

[dev-dependencies]
tower.workspace = true
sea-orm.workspace = true
agent-test-support = { path = "../../crates/agent-test-support" }
agent-client = { path = "../../crates/agent-client" }
tempfile.workspace = true
tokio-stream.workspace = true
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
