[package]
name = "agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures.workspace = true
tokio.workspace = true
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-markdown.workspace = true
ratatui-textarea.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
agent-client = { path = "../../crates/agent-client" }
agent-protocol = { path = "../../crates/agent-protocol" }
uuid.workspace = true
tracing.workspace = true
agent-config = { path = "../../crates/agent-config" }
agent-telemetry = { path = "../../crates/agent-telemetry" }
agent-launch = { path = "../../crates/agent-launch" }
agent-browser-runtime = { path = "../../crates/agent-browser-runtime" }
agent-computer-runtime = { path = "../../crates/agent-computer-runtime", default-features = false }
thiserror.workspace = true
fluxdi.workspace = true
serde_json.workspace = true

[dev-dependencies]
async-trait.workspace = true
agent-computer = { path = "../../crates/agent-computer", default-features = false }
agentd = { path = "../agentd" }
agent-test-support = { path = "../../crates/agent-test-support" }
portable-pty = "0.9"
vt100 = "0.18"
tempfile.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[features]
default = []
native-cef = ["agent-browser-runtime/native-cef"]
native-computer = ["agent-computer-runtime/native"]

[lib]
crate-type = ["rlib", "cdylib"]
