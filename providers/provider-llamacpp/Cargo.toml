[package]
name = "provider-llamacpp"
version.workspace = true
edition.workspace = true

[features]
default = []
llama-cpp = ["dep:encoding_rs", "dep:llama-cpp-2"]
cuda = ["llama-cpp", "llama-cpp-2/cuda"]
vulkan = ["llama-cpp", "llama-cpp-2/vulkan"]

[dependencies]
agent-core = { workspace = true }
agent-model = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
llama-cpp-2 = { workspace = true, optional = true }
encoding_rs = { version = "0.8.35", optional = true }
jsonschema = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
