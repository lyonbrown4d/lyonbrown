[package]
name = "gateway-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = [
  "dep:axum", "dep:decision-core", "dep:gateway-core", "dep:gateway-storage",
  "dep:leptos_axum", "dep:tokio", "dep:tower-http", "dep:cookie", "dep:governor", "dep:nonzero_ext",
  "leptos/ssr", "leptos/nonce", "leptos_meta/ssr", "leptos_router/ssr", "leptos-use/ssr",
]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
garde = { version = "=0.23.0", default-features = false, features = ["derive"] }
gateway-validation = { path = "../gateway-validation" }
axum = { version = "0.8.9", features = ["form"], optional = true }
cookie = { workspace = true, optional = true }
governor = { workspace = true, optional = true }
nonzero_ext = { workspace = true, optional = true }
decision-core = { path = "../decision-core", optional = true }
gateway-core = { path = "../gateway-core", optional = true }
gateway-storage = { path = "../gateway-storage", optional = true }
html-escape = "0.3.0"
leptos = { version = "=0.8.22", default-features = false }
leptos_axum = { version = "=0.8.10", optional = true }
leptos_meta = { version = "=0.8.7", default-features = false }
leptos_router = { version = "=0.8.17", default-features = false }
leptos-struct-table = { version = "=0.19.1", default-features = false }
leptos-use = { version = "=0.20.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tower-http = { version = "0.7", features = ["fs", "limit"], optional = true }
url = "2.5.8"
wasm-bindgen = { version = "=0.2.130", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile.workspace = true
tower.workspace = true
