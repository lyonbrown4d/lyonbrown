language: "typescript"
layer: "library"
fileGroups:
  package: ["/packages/kernel-pi/**/*"]
tasks:
  lint:
    args: ["--dir", "packages/kernel-pi", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      ["--dir", "packages/kernel-pi", "--config.enable-pre-post-scripts=false", "run", "typecheck"]
  test:
    args: ["--dir", "packages/kernel-pi", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args: ["--dir", "packages/kernel-pi", "--config.enable-pre-post-scripts=false", "run", "build"]
    outputs: ["/packages/kernel-pi/dist"]
