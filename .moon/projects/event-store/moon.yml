language: "typescript"
layer: "library"
fileGroups:
  package: ["/packages/event-store/**/*"]
tasks:
  lint:
    args: ["--dir", "packages/event-store", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      [
        "--dir",
        "packages/event-store",
        "--config.enable-pre-post-scripts=false",
        "run",
        "typecheck",
      ]
  test:
    args: ["--dir", "packages/event-store", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args:
      ["--dir", "packages/event-store", "--config.enable-pre-post-scripts=false", "run", "build"]
    outputs: ["/packages/event-store/dist"]
