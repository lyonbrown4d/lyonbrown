language: "typescript"
layer: "library"
fileGroups:
  package: ["/packages/ui-model/**/*"]
tasks:
  lint:
    args: ["--dir", "packages/ui-model", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      ["--dir", "packages/ui-model", "--config.enable-pre-post-scripts=false", "run", "typecheck"]
  test:
    args: ["--dir", "packages/ui-model", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args: ["--dir", "packages/ui-model", "--config.enable-pre-post-scripts=false", "run", "build"]
    outputs: ["/packages/ui-model/dist"]
