[package]
name = "agent-computer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
native = ["dep:xcap", "dep:enigo", "dep:accessibility-sys", "dep:core-foundation", "dep:core-graphics", "dep:windows", "dep:zbus"]

[[example]]
name = "inspect_native"
required-features = ["native"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
uuid.workspace = true
xcap = { version = "=0.9.8", optional = true }
enigo = { version = "=0.6.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = { version = "=0.2.0", optional = true }
core-foundation = { version = "0.10", optional = true }
core-graphics = { version = "0.25", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }
