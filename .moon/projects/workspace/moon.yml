language: "typescript"
layer: "tool"
dependsOn:
  - "agent-client"
  - "agent-launch"
  - "agentd"
  - "control-plane-native"
  - "local-control-plane"

workspace:
  inheritedTasks:
    include: []

fileGroups:
  root-configs:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
    - "/tsconfig.json"
    - "/tsconfig.build.json"
  scripts:
    - "/scripts/**/*.ts"
  lint-configs:
    - "/eslint.config.mjs"

tasks:
  lint:
    command: "eslint scripts/**/*.ts eslint.config.mjs"
    toolchains: "system"
    inputs:
      - "@group(root-configs)"
      - "@group(scripts)"
      - "@group(lint-configs)"
    deps: ["^:build"]
    options:
      runFromWorkspaceRoot: true

  typecheck:
    command: "tsc --noEmit -p tsconfig.json"
    toolchains: "system"
    inputs:
      - "@group(root-configs)"
      - "@group(scripts)"
    deps: ["^:build"]
    options:
      runFromWorkspaceRoot: true

  test:
    command: "vitest run --dir scripts/tests"
    toolchains: "system"
    inputs:
      - "@group(root-configs)"
      - "@group(scripts)"
    deps: ["^:build"]
    options:
      runFromWorkspaceRoot: true

  build:
    command: "tsc -p tsconfig.build.json"
    toolchains: "system"
    inputs:
      - "@group(root-configs)"
      - "@group(scripts)"
    deps: ["^:build"]
    outputs:
      - "/dist"
    options:
      runFromWorkspaceRoot: true

  dev:
    command: "pnpm exec tsx apps/agent-cli/src/main.ts"
    toolchains: "system"
    deps:
      - "agent-cli:build"
    preset: "server"
    options:
      interactive: true
      runFromWorkspaceRoot: true
