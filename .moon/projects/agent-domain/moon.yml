language: "typescript"
layer: "library"
fileGroups:
  package: ["/packages/agent-domain/**/*"]
tasks:
  lint:
    args:
      ["--dir", "packages/agent-domain", "--config.enable-pre-post-scripts=false", "run", "lint"]
  typecheck:
    args:
      [
        "--dir",
        "packages/agent-domain",
        "--config.enable-pre-post-scripts=false",
        "run",
        "typecheck",
      ]
  test:
    args:
      ["--dir", "packages/agent-domain", "--config.enable-pre-post-scripts=false", "run", "test"]
  build:
    args:
      ["--dir", "packages/agent-domain", "--config.enable-pre-post-scripts=false", "run", "build"]
    outputs: ["/packages/agent-domain/dist"]
