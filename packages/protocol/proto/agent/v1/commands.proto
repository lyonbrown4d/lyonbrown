syntax = "proto3";

package lyonbrown.agent.v1;

import "agent/v1/snapshot.proto";

message RequestMetadata {
  uint32 protocol_version = 1;
  string client_instance_id = 2;
  string command_id = 3;
  // Empty only before the handshake. Commands must target one daemon epoch.
  string expected_server_instance_id = 4;
}

message HealthRequest { RequestMetadata metadata = 1; }

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_SERVING = 1;
}

message HealthResponse {
  uint32 protocol_version = 1;
  HealthStatus status = 2;
}

message HandshakeRequest {
  RequestMetadata metadata = 1;
  string client_name = 2;
  string client_version = 3;
}

message HandshakeResponse {
  uint32 protocol_version = 1;
  string server_version = 2;
  string server_instance_id = 3;
  repeated string capabilities = 4;
  // Canonical SHA-256 identity of the workspace and runtime configuration.
  string scope_fingerprint = 5;
}

message StartTurnRequest {
  RequestMetadata metadata = 1;
  string text = 2;
}

message SteerCurrentTurnRequest {
  RequestMetadata metadata = 1;
  string text = 2;
}

message QueueFollowUpRequest {
  RequestMetadata metadata = 1;
  string text = 2;
}

message CancelTurnRequest { RequestMetadata metadata = 1; }
message ForceStopRequest { RequestMetadata metadata = 1; }

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_ALLOW_ONCE = 1;
  APPROVAL_DECISION_ALLOW_FOR_SESSION = 2;
  APPROVAL_DECISION_DENY_ONCE = 3;
  APPROVAL_DECISION_DENY_REMAINING = 4;
}

message RespondApprovalRequest {
  RequestMetadata metadata = 1;
  string request_id = 2;
  ApprovalDecision decision = 3;
}

message SelectSessionModelRequest {
  RequestMetadata metadata = 1;
  ModelSelection selection = 2;
}

message StartModelDownloadRequest {
  RequestMetadata metadata = 1;
  string model_id = 2;
}

message CancelModelDownloadRequest {
  RequestMetadata metadata = 1;
  string operation_id = 2;
}

message CommandResponse {
  uint32 protocol_version = 1;
  string command_id = 2;
  bool accepted = 3;
}

enum CommandErrorCode {
  COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  COMMAND_ERROR_CODE_RUNTIME_STOPPED = 1;
  COMMAND_ERROR_CODE_TURN_ALREADY_ACTIVE = 2;
  COMMAND_ERROR_CODE_NO_ACTIVE_TURN = 3;
  COMMAND_ERROR_CODE_EMPTY_TEXT = 4;
  COMMAND_ERROR_CODE_STEERING = 5;
  COMMAND_ERROR_CODE_NO_PENDING_APPROVAL = 6;
  COMMAND_ERROR_CODE_APPROVAL_REQUEST_MISMATCH = 7;
  COMMAND_ERROR_CODE_UNSUPPORTED = 8;
  COMMAND_ERROR_CODE_MODEL_SETUP_REQUIRED = 9;
  COMMAND_ERROR_CODE_MODEL_DOWNLOAD_UNAVAILABLE = 10;
  COMMAND_ERROR_CODE_INVALID_MODEL_ID = 11;
  COMMAND_ERROR_CODE_NO_ACTIVE_MODEL_DOWNLOAD = 12;
  COMMAND_ERROR_CODE_MODEL_DOWNLOAD_OPERATION_MISMATCH = 13;
  COMMAND_ERROR_CODE_MODEL_DOWNLOAD_CANCELLATION_TOO_LATE = 14;
  COMMAND_ERROR_CODE_EPOCH_MISMATCH = 15;
}

enum UnsupportedCommand {
  UNSUPPORTED_COMMAND_UNSPECIFIED = 0;
  UNSUPPORTED_COMMAND_FORCE_STOP = 1;
  UNSUPPORTED_COMMAND_RESPOND_APPROVAL = 2;
  UNSUPPORTED_COMMAND_SELECT_SESSION_MODEL = 3;
  UNSUPPORTED_COMMAND_START_MODEL_DOWNLOAD = 4;
  UNSUPPORTED_COMMAND_CANCEL_MODEL_DOWNLOAD = 5;
}

message ApprovalRequestMismatchDetail {
  string expected_request_id = 1;
  string received_request_id = 2;
}

message InvalidModelIdDetail {
  string requested_model_id = 1;
  string configured_model_id = 2;
}

message ModelDownloadOperationMismatchDetail {
  string expected_operation_id = 1;
  string received_operation_id = 2;
}

message EpochMismatchDetail {
  string expected_server_instance_id = 1;
  string actual_server_instance_id = 2;
}

message CommandErrorDetail {
  CommandErrorCode code = 1;

  oneof context {
    string steering_reason = 2;
    ApprovalRequestMismatchDetail approval_request_mismatch = 3;
    UnsupportedCommand unsupported_command = 4;
    InvalidModelIdDetail invalid_model_id = 5;
    ModelDownloadOperationMismatchDetail model_download_operation_mismatch = 6;
    EpochMismatchDetail epoch_mismatch = 7;
  }
}

message GetSnapshotRequest { RequestMetadata metadata = 1; }

message SubscribeEventsRequest {
  RequestMetadata metadata = 1;
  uint64 after_revision = 2;
}
