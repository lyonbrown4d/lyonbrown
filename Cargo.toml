[workspace]
resolver = "3"
members = ["crates/*", "apps/agentd", "apps/agent-cli", "apps/agent-desktop", "apps/agent-control", "apps/agent-dev", "apps/model-mock"]
default-members = ["apps/agentd", "apps/agent-cli", "apps/agent-control"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
rig-memory = { version = "=0.46.0", default-features = false }
diffy = "=0.5.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
wiremock = "=0.6.5"

qdrant-edge = "=0.9.0"
qdrant-client = { version = "=1.20.0", default-features = false, features = ["serde"] }

sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"] }

tui-markdown = { version = "=0.3.13", default-features = false }
async-channel = "=2.5.0"
cargo_metadata = "=0.23.1"
cookie = "=0.18.2"
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
nonzero_ext = "=0.3.0"
ratatui-textarea = { version = "=0.9.4", default-features = false, features = ["crossterm"] }
ratatui-interact = { version = "=0.5.4", default-features = false }
# gpui-component 0.9 links tree-sitter 0.26; Cargo forbids linking 0.27 alongside it.
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-md = "=0.5.4"
secrecy = { version = "=0.10.3", features = ["serde"] }
strum = { version = "=0.28.0", features = ["derive"] }
utoipa-axum = "=0.3.0"
rig-core = { version = "=0.46.0", default-features = false }
rig-agent = { version = "=0.46.0", default-features = false }
rig-rmcp = { version = "=0.46.0", default-features = false }
rig-qdrant = { version = "=0.46.0", default-features = false }
getrandom = "=0.4.3"
rig-reqwest = { version = "=0.46.0", default-features = false, features = ["rustls"] }
fluxdi = { version = "=2.0.0", default-features = false, features = ["thread-safe", "macros", "async-factory", "lifecycle"] }
anyhow = "=1.0.104"
async-trait = "=0.1.92"
clap = { version = "=4.6.7", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = "=0.7.20"
tokio-stream = { version = "=0.1.19", features = ["net", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
futures = "=0.3.34"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.29.0", features = ["v4", "v7", "serde"] }
tempfile = "=3.27.0"
tonic = { version = "=0.14.9", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.9"
prost = "=0.14.4"
sha2 = "=0.11.1"
hex = "=0.4.3"
fs2 = "=0.4.3"
libc = "=0.2.191"
shell-words = "=1.1.1"
directories = "=6.0.0"
dotenvy = "=0.15.7"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Real CPU inference requires optimized Rust kernels; avoid release LTO during acceptance.
[profile.native-acceptance]
inherits = "dev"
opt-level = 3
debug = 0
incremental = false
lto = false
codegen-units = 16
