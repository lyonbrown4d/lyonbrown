[package]
name = "agent-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-security = { path = "../agent-security" }
agent-runtime = { path = "../agent-runtime" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "stream"] }
jsonschema = { version = "0.18.3", default-features = false, features = ["draft202012"] }
url = "2.5"
http = "1"
futures.workspace = true
sse-stream = "0.2.4"
base64 = "0.22"

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tempfile.workspace = true

[features]
test-fixtures = ["rmcp/server", "rmcp/transport-io"]

[[bin]]
name = "agent-mcp-fixture"
path = "tests/support/stdio_fixture.rs"
required-features = ["test-fixtures"]
