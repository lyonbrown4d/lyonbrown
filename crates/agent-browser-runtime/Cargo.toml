[package]
name = "agent-browser-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "browser-native-acceptance"
path = "examples/native_acceptance.rs"
required-features = ["native-cef"]

[dependencies]
agent-telemetry = { path = "../agent-telemetry" }
tracing.workspace = true
agent-client = { path = "../agent-client" }
agent-protocol = { path = "../agent-protocol" }
tokio.workspace = true
tokio-stream.workspace = true
agent-browser = { path = "../agent-browser" }
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true
fluxdi.workspace = true
cef = { version = "154.5.0", default-features = false, features = ["sandbox", "resources"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent"], optional = true }

[features]
default = []
native-cef = ["dep:cef", "dep:objc2", "dep:objc2-app-kit"]

[dev-dependencies]
tempfile.workspace = true
